name: Generate pixel profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Render Fuji and CRT cards
        uses: Sver0411/pixel-profile/action@1487cde5a2fc9478c58ad0118384b69a1c4d1361
        with:
          outputs: |
            dist/github-stats?username=Sver0411&screen_effect=false&theme=fuji&dithering=true&hide=avatar
          crt_outputs: |
            dist/github-stats-crt?username=Sver0411

      - name: Publish cards to output branch
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
