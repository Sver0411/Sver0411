<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .pixel { shape-rendering: crispEdges; }
    .star { animation: blink 2.4s steps(2,end) infinite; }
    .star.b { animation-delay: .8s; }
    .star.c { animation-delay: 1.6s; }
    .cursor { animation: blink .9s steps(2,end) infinite; }
    .scan { animation: scan 7s linear infinite; }
    @keyframes blink { 50% { opacity: .18; } }
    @keyframes scan { from { transform: translateY(-340px); } to { transform: translateY(340px); } }
  </style>
